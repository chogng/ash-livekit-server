name: LiveKit dependency distribution
on:
  push:
    branches: [main]
    tags: ["livekit-v*-ash.*"]
    paths: &recipe-paths
      - "build-inputs.json"
      - "upstream-lock.json"
      - "build_release.py"
      - "producer.py"
      - "artifacts.py"
      - "file_lock.py"
      - "test_build_release.py"
      - "LIVEKIT-*"
      - ".github/workflows/**"
  pull_request:
    paths: *recipe-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: livekit-dependency-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Native server (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate pinned build tools
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          go = json.loads(Path('build-inputs.json').read_text(encoding='utf-8'))['goVersion']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', go)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('go_version=' + go + '\n')
          PY
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: runner.os == 'macOS'
        with:
          go-version: ${{ steps.source.outputs.go_version }}
          cache: false
      - name: Test release integrity boundaries
        run: python -B -m unittest -v test_build_release
      - name: Prepare, execute and package the native server
        run: python -B build_release.py build --target ${{ matrix.target }} --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: livekit-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
  verify:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: livekit-*
          path: dist
          merge-multiple: true
      - name: Verify all targets and generate the exact consumer lock
        run: python3 -B build_release.py aggregate --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: livekit-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/livekit-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: livekit-release
          path: dist
      - name: Publish the immutable dependency release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
          --verify-tag --latest=false --title "$RELEASE_TAG"
          --notes "Native-version-verified LiveKit Server archives for six targets. Includes exact archive hashes, upstream and build-harness provenance, and the consumer runtime-lock.json."
